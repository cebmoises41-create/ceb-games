<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Examen Licencia CDMX</title>
    <style>
        /* ===== ESTILOS GLOBALES ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* FONDO AMARILLO PÁLIDO (No chillante) */
            background: #FFF8E1; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            /* TEXTO GENERAL EN NEGRO */
            color: #000000; 
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 15px;
            /* BORDE NEGRO GRUESO EN EL CONTENEDOR PRINCIPAL */
            border: 4px solid #000000; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        h1 {
            text-align: center;
            color: #000000; /* Negro */
            font-size: 24px;
            margin-bottom: 20px;
        }

        /* ===== ESTADO DE INICIO (Bienvenida) ===== */
        #welcome-screen {
            text-align: center;
            padding: 20px 0;
        }
        
        #welcome-screen p {
            color: #000000; /* Negro */
            font-size: 16px;
            margin-bottom: 20px;
        }

        .btn-start {
            background: #000000; /* Botón negro */
            color: #ffffff; /* Texto blanco */
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-start:hover {
            background: #333333;
        }

        /* ===== ESTADO DEL EXAMEN ===== */
        #exam-screen {
            display: none;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #000000; /* Negro */
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #000000; /* Barra de progreso negra */
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 20px;
            margin-bottom: 25px;
            color: #000000; /* Negro */
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #f7fafc;
            /* BORDE NEGRO EN LAS OPCIONES */
            border: 2px solid #000000; 
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            color: #000000; /* Texto negro */
        }

        .option-btn:hover {
            background: #edf2f7;
            border-color: #333333;
        }

        .option-btn.correct {
            background: #c6f6d5;
            border-color: #000000; /* Borde negro al acertar */
        }

        .option-btn.incorrect {
            background: #fed7d7;
            border-color: #000000; /* Borde negro al fallar */
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .btn-next {
            display: none;
            background: #000000; /* Botón negro */
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 auto;
            transition: background 0.3s;
        }

        .btn-next:hover {
            background: #333333;
        }

        /* ===== PANTALLA DE RESULTADOS ===== */
        #result-screen {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        #result-screen h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #000000;
        }

        #result-screen .score {
            font-size: 48px;
            font-weight: bold;
            color: #000000; /* Número negro */
        }

        #result-screen .message {
            margin: 20px 0;
            font-size: 18px;
            color: #000000; /* Texto negro */
        }

        .btn-restart {
            background: #000000; /* Botón negro */
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-restart:hover {
            background: #333333;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 20px; }
            .question-text { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚗 Simulador Licencia CDMX</h1>

        <!-- Pantalla de Inicio -->
        <div id="welcome-screen">
            <p>Responde correctamente las preguntas del examen para obtener tu licencia de conducir en la CDMX.</p>
            <button class="btn-start" onclick="startExam()">Comenzar Examen</button>
        </div>

        <!-- Pantalla del Examen -->
        <div id="exam-screen">
            <div class="header-info">
                <span id="question-counter">Pregunta 1 de 10</span>
                <span id="score-display">Aciertos: 0</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="question-text" id="question-text">Cargando pregunta...</div>
            
            <div class="options-list" id="options-list">
                <!-- Las opciones se llenarán con JS -->
            </div>

            <button class="btn-next" id="btn-next" onclick="nextQuestion()">Siguiente Pregunta</button>
        </div>

        <!-- Pantalla de Resultados -->
        <div id="result-screen">
            <h2 id="result-title">¡Examen Finalizado!</h2>
            <div class="score" id="final-score">0/10</div>
            <div class="message" id="result-message">Tu resultado está siendo evaluado...</div>
            <button class="btn-restart" onclick="restartExam()">Reintentar Examen</button>
        </div>
    </div>

    <script>
        // ===== BASE DE DATOS DE PREGUNTAS (10 preguntas de ejemplo) =====
        const questions = [
            {
                question: "¿Cuál es la velocidad máxima permitida en avenidas principales de la CDMX?",
                options: ["40 km/h", "50 km/h", "60 km/h", "70 km/h"],
                correct: 1 // Índice 1 es "50 km/h"
            },
            {
                question: "¿Qué significa una luz amarilla intermitente en un semáforo?",
                options: ["Detenerse obligatoriamente", "Precaución y ceder el paso", "Acelerar para cruzar", "Alto total"],
                correct: 1
            },
            {
                question: "¿Cada cuánto tiempo se debe renovar la licencia de conducir para particulares?",
                options: ["Cada año", "Cada 2 años", "Cada 3 años", "Cada 5 años"],
                correct: 2 // Índice 2 es "Cada 3 años"
            },
            {
                question: "En una glorieta, ¿quién tiene la preferencia de paso?",
                options: ["El vehículo que entra", "El vehículo que ya está dentro", "El vehículo más rápido", "El de la derecha"],
                correct: 1
            },
            {
                question: "¿Está permitido estacionarse en una parada de autobús?",
                options: ["Sí, por unos minutos", "Sí, si no hay autobús", "No, nunca", "Solo si es de noche"],
                correct: 2
            },
            {
                question: "¿Cuál es el límite de alcohol en sangre para conducir en la CDMX?",
                options: ["0.00 g/L", "0.05 g/L", "0.08 g/L", "0.10 g/L"],
                correct: 1 // Nota: 0.05 o 0.04 según zona, en CDMX para automovilista es 0.05
            },
            {
                question: "Si un peatón está cruzando la calle en un paso de cebra, ¿qué debes hacer?",
                options: ["Tocar el claxon", "Esperar a que cruce", "Pasar rápido por atrás", "Pasar primero si no te ve"],
                correct: 1
            },
            {
                question: "¿Qué documento NO es obligatorio portar al conducir?",
                options: ["Tarjeta de circulación", "Licencia de conducir", "Constancia de seguro", "Factura del auto"],
                correct: 3
            },
            {
                question: "¿Cómo se llama la distancia que debe mantener un auto con el de adelante?",
                options: ["Distancia de frenado", "Distancia de seguridad", "Distancia de reacción", "Distancia mínima"],
                correct: 1
            },
            {
                question: "¿Está permitido usar el teléfono celular mientras se conduce con manos libres?",
                options: ["Sí, siempre", "No, nunca", "Sí, pero solo en avenidas", "Sí, solo para GPS"],
                correct: 1
            }
        ];

        // ===== VARIABLES DE ESTADO =====
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;

        // ===== ELEMENTOS DEL DOM =====
        const welcomeScreen = document.getElementById('welcome-screen');
        const examScreen = document.getElementById('exam-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const optionsList = document.getElementById('options-list');
        const btnNext = document.getElementById('btn-next');
        const questionCounter = document.getElementById('question-counter');
        const scoreDisplay = document.getElementById('score-display');
        const progressFill = document.getElementById('progress-fill');
        const finalScore = document.getElementById('final-score');
        const resultMessage = document.getElementById('result-message');
        const resultTitle = document.getElementById('result-title');

        // ===== FUNCIONES PRINCIPALES =====
        function startExam() {
            welcomeScreen.style.display = 'none';
            examScreen.style.display = 'block';
            currentQuestionIndex = 0;
            score = 0;
            isAnswered = false;
            loadQuestion();
        }

        function loadQuestion() {
            const currentQ = questions[currentQuestionIndex];
            questionText.textContent = currentQ.question;
            questionCounter.textContent = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;
            scoreDisplay.textContent = `Aciertos: ${score}`;
            
            // Actualizar barra de progreso
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            progressFill.style.width = `${progress}%`;

            // Generar opciones
            optionsList.innerHTML = '';
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectOption(index, btn);
                optionsList.appendChild(btn);
            });

            // Ocultar botón siguiente y resetear estado
            btnNext.style.display = 'none';
            isAnswered = false;
        }

        function selectOption(index, btnElement) {
            if (isAnswered) return; // Bloquear doble click

            const currentQ = questions[currentQuestionIndex];
            const buttons = optionsList.querySelectorAll('.option-btn');
            
            // Deshabilitar todos los botones
            buttons.forEach(btn => btn.disabled = true);

            // Marcar respuesta correcta e incorrecta
            if (index === currentQ.correct) {
                btnElement.classList.add('correct');
                score++;
                scoreDisplay.textContent = `Aciertos: ${score}`;
            } else {
                btnElement.classList.add('incorrect');
                // Mostrar la correcta
                buttons[currentQ.correct].classList.add('correct');
            }

            isAnswered = true;
            btnNext.style.display = 'block';
            
            // Cambiar texto del botón si es la última pregunta
            if (currentQuestionIndex === questions.length - 1) {
                btnNext.textContent = 'Ver Resultados';
            } else {
                btnNext.textContent = 'Siguiente Pregunta';
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            examScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            
            finalScore.textContent = `${score}/${questions.length}`;
            const percentage = (score / questions.length) * 100;

            if (percentage >= 80) {
                resultTitle.textContent = "🎉 ¡Aprobado!";
                resultMessage.textContent = "Felicidades, has obtenido un excelente resultado. Estás listo para conducir.";
            } else if (percentage >= 50) {
                resultTitle.textContent = "⚠️ Por poco...";
                resultMessage.textContent = "Has obtenido un resultado regular. Te recomendamos estudiar un poco más el reglamento.";
            } else {
                resultTitle.textContent = "📖 Necesitas estudiar";
                resultMessage.textContent = "Revisa el reglamento de tránsito de la CDMX e inténtalo de nuevo.";
            }
        }

        function restartExam() {
            resultScreen.style.display = 'none';
            welcomeScreen.style.display = 'block';
        }
    </script>

</body>
</html>
