<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador Examen Licencia CDMX</title>
    <style>
        /* ===== ESTILOS GLOBALES ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* AQUÍ ESTÁ EL AMARILLO SUAVE QUE PEDISTE */
            background: #FFF5C2; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        /* ===== ESTILO DEL NUEVO AUTO NEGRO ===== */
        .auto-negro {
            width: 350px; /* Tamaño grande como pediste */
            height: auto;
            display: block;
            margin: 20px auto; /* Centrado y con espacio arriba/abajo */
            filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.2)); /* Sombra sutil */
        }

        /* ===== CONTENEDOR PRINCIPAL (Donde irán las preguntas) ===== */
        .contenedor-juego {
            background-color: white;
            max-width: 800px;
            width: 100%;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
        }

        /* ===== ESTILOS BÁSICOS PARA EL EXAMEN ===== */
        h1 {
            font-size: 24px;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .pregunta {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #222;
        }

        .opciones {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .opcion {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .opcion:hover {
            background-color: #f0f0f0;
        }

        .btn-siguiente {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .btn-siguiente:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>

    <!-- ===== EL AUTO NEGRO (Reemplazó a la carita, avión y cuadro) ===== -->
    <img src="https://cdn-icons-png.flaticon.com/512/3202/3202927.png" alt="Auto Negro" class="auto-negro">

    <!-- ===== CONTENEDOR DEL EXAMEN ===== -->
    <div class="contenedor-juego">
        <h1>Simulador de Examen</h1>
        
        <div id="pregunta-container">
            <p class="pregunta" id="texto-pregunta">¿Cuál es la velocidad máxima en avenidas principales?</p>
            
            <div class="opciones" id="opciones-container">
                <div class="opcion">A) 30 km/h</div>
                <div class="opcion">B) 50 km/h</div>
                <div class="opcion">C) 70 km/h</div>
                <div class="opcion">D) 90 km/h</div>
            </div>

            <button class="btn-siguiente">Siguiente pregunta</button>
        </div>
    </div>

    <!-- Aquí iría el enlace a tu script.js si tienes la lógica del examen en otro archivo -->
    <!-- <script src="script.js"></script> -->

</body>
</html>
