<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador Examen Licencia CDMX</title>
    <style>
        /* ===== ESTILOS GLOBALES ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* AMARILLO MÁS PÁLIDO (NO CHILLANTE) */
            background: #FFF8E1; 
            color: #000000; /* Texto general en NEGRO */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .contenedor-juego {
            background-color: #ffffff;
            max-width: 700px;
            width: 100%;
            padding: 30px;
            /* MARGEN NEGRO (borde grueso) */
            border: 4px solid #000000; 
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }

        /* ===== TÍTULOS Y TEXTOS EN NEGRO ===== */
        h1, h2, h3 {
            color: #000000;
            text-align: center;
            margin-bottom: 20px;
        }

        .pregunta {
            font-size: 20px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 20px;
        }

        /* ===== ESTILO DE LAS OPCIONES (Tipo tarjeta como te gustaba) ===== */
        .opciones {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .opcion {
            padding: 15px 20px;
            /* MARGEN NEGRO en cada opción */
            border: 2px solid #000000; 
            border-radius: 8px;
            color: #000000;
            cursor: pointer;
            transition: all 0.3s;
            background-color: #fafafa;
        }

        .opcion:hover {
            background-color: #e0e0e0; /* Un gris suave al pasar el mouse */
        }

        /* ===== BOTONES Y CONTROLES ===== */
        .controles-modo {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            /* MARGEN NEGRO en los botones */
            border: 2px solid #000000; 
            background-color: #ffffff;
            color: #000000;
        }

        .btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        .btn-siguiente {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            /* MARGEN NEGRO en el botón de siguiente */
            border: 2px solid #000000;
            background-color: #ffffff;
            color: #000000;
            margin-top: 10px;
        }

        .btn-siguiente:hover {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Contenedor principal -->
    <div class="contenedor-juego">
        
        <!-- Título -->
        <h1>Simulador de Examen</h1>

        <!-- SELECTOR DE MODO FÁCIL Y DIFÍCIL -->
        <div class="controles-modo">
            <button class="btn" onclick="seleccionarModo('facil')">Modo Fácil</button>
            <button class="btn" onclick="seleccionarModo('dificil')">Modo Difícil</button>
        </div>

        <!-- Área de la pregunta (Aquí va la lógica de tu juego) -->
        <div id="pregunta-container">
            <p class="pregunta" id="texto-pregunta">¿Listo para comenzar? Selecciona un modo.</p>
            
            <div class="opciones" id="opciones-container">
                <!-- Ejemplo de opciones visuales -->
                <div class="opcion">Opción A</div>
                <div class="opcion">Opción B</div>
                <div class="opcion">Opción C</div>
                <div class="opcion">Opción D</div>
            </div>

            <button class="btn-siguiente" id="btn-siguiente">Siguiente pregunta</button>
        </div>
    </div>

    <!-- Aquí va el enlace a tu archivo de lógica (script.js) -->
    <!-- <script src="script.js"></script> -->

    <!-- (Opcional) Si quieres probar que los botones funcionan visualmente, copia esto: -->
    <script>
        function seleccionarModo(modo) {
            const textoPregunta = document.getElementById('texto-pregunta');
            if(modo === 'facil') {
                textoPregunta.textContent = "Modo Fácil activado. ¿Cuál es el color de un semáforo en verde?";
            } else {
                textoPregunta.textContent = "Modo Difícil activado. ¿A qué distancia debo frenar si voy a 60 km/h?";
            }
        }
    </script>

</body>
</html>
